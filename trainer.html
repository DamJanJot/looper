<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MIDI Trainer C3-G5</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/trainer.css">
</head>
<body>
  <main class="trainer-app">
    <header class="trainer-top">
      <a href="index.html" class="back-link">Looper</a>
      <h1>Trener MIDI <span id="rangeTitle">C3-G5</span></h1>
      <div class="top-actions">
        <button id="audioBtn" class="primary">Audio</button>
        <button id="midiBtn">MIDI</button>
        <button id="previewBtn">Odsłuch</button>
        <button id="startBtn" class="primary">Start</button>
        <button id="stopBtn">Stop</button>
      </div>
    </header>

    <section class="trainer-controls">
      <label>Lekcja
        <select id="lessonSelect"></select>
      </label>
      <label>Tempo
        <input id="tempoInput" type="range" min="50" max="150" value="76" step="1">
        <span id="tempoLabel">76 BPM</span>
      </label>
      <div class="octave-control">
        <span>Zakres</span>
        <b id="rangeLabel">C3-G5</b>
        <div class="octave-buttons">
          <button id="octaveDown">-</button>
          <button id="octaveUp">+</button>
        </div>
      </div>
      <div class="stat"><span>Następna</span><b id="nextNote">--</b></div>
      <div class="stat"><span>Wynik</span><b id="score">0</b></div>
      <div class="stat"><span>Combo</span><b id="combo">0</b></div>
      <div class="stat"><span>Trafione</span><b id="hits">0 / 0</b></div>
      <div id="midiStatus" class="midi-status">MIDI: niepołączone</div>
    </section>

    <section class="trainer-stage-wrap">
      <div id="stage" class="stage">
        <div id="laneLayer" class="lane-layer"></div>
        <div id="noteLayer" class="note-layer"></div>
        <div class="hit-line"><span>GRAJ</span></div>
      </div>
      <div class="keyboard-shell">
        <aside class="keystation-controls" aria-label="Panel Keystation Mini 32">
          <div class="side-buttons" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="control-brand">
            <span>KEYSTATION</span>
            <b>MINI 32</b>
          </div>
          <div class="volume-stack">
            <div class="usb-jack" aria-hidden="true"></div>
            <div class="volume-knob" aria-hidden="true"></div>
            <span>VOLUME</span>
          </div>
          <div class="pad-grid">
            <button id="deviceSust" class="device-pad blue" type="button" aria-pressed="false" aria-label="Sustain">
              <span class="pad-dot"></span>
              <small>SUST</small>
            </button>
            <button id="deviceEdit" class="device-pad blue" type="button" aria-label="Edit">
              <small>EDIT</small>
            </button>
            <button id="deviceOctDown" class="device-pad red" type="button" aria-label="Octave down">
              <b>-</b>
            </button>
            <button id="deviceOctUp" class="device-pad red" type="button" aria-label="Octave up">
              <b>+</b>
            </button>
          </div>
          <div class="oct-data-label">OCT/DATA</div>
          <div class="pitch-row">
            <button class="soft-pad" type="button" data-hold-pad><span>&lt;PB</span></button>
            <button class="soft-pad" type="button" data-hold-pad><span>MOD</span></button>
            <button class="soft-pad" type="button" data-hold-pad><span>PB&gt;</span></button>
          </div>
        </aside>
        <div class="keybed">
          <div class="keybed-rail">
            <span class="rail-title">KEYSTATION MINI 32</span>
            <span id="railRange" class="rail-range">C3-G5</span>
            <span class="rail-logo">M-AUDIO</span>
          </div>
          <div id="keyboard" class="keyboard"></div>
        </div>
      </div>
    </section>

    <footer class="trainer-footer">
      <span id="status">gotowy</span>
    </footer>
  </main>
  <script src="assets/trainer.js"></script>
</body>
</html>
