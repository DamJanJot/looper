<!doctype html><html lang="pl"><meta charset="utf-8"><title>Looper — kontrola audio</title>
<body style="background:#101322;color:#eee;font:16px system-ui;padding:24px"><h1>Kontrola renderowania bitów</h1><p>Render offline: sygnał, poziomy i długość taktów. Ocena gustu wymaga odsłuchu.</p><pre id="results">Renderowanie…</pre><div id="previews"></div><script src="../assets/beats.js"></script><script>
function wav(buffer){const length=buffer.length, data=new DataView(new ArrayBuffer(44+length*2));let offset=0;const text=s=>{for(const char of s)data.setUint8(offset++,char.charCodeAt(0))};text('RIFF');data.setUint32(offset,36+length*2,true);offset+=4;text('WAVEfmt ');data.setUint32(offset,16,true);offset+=4;data.setUint16(offset,1,true);offset+=2;data.setUint16(offset,1,true);offset+=2;data.setUint32(offset,buffer.sampleRate,true);offset+=4;data.setUint32(offset,buffer.sampleRate*2,true);offset+=4;data.setUint16(offset,2,true);offset+=2;data.setUint16(offset,16,true);offset+=2;text('data');data.setUint32(offset,length*2,true);offset+=4;for(const sample of buffer.getChannelData(0)){data.setInt16(offset,Math.max(-1,Math.min(1,sample))*32767,true);offset+=2}return new Blob([data],{type:'audio/wav'})}
(async()=>{const results=[];for(const [name,preset]of Object.entries(LooperBeats.presets)){const bar=8*60/preset.bpm,ctx=new OfflineAudioContext(1,Math.ceil((bar*2+1)*44100),44100),master=ctx.createGain();master.gain.value=.72;master.connect(ctx.destination);const kit=LooperBeats.kitFor(preset);for(let loop=0;loop<2;loop++){const times=[];let time=loop*bar+.04;for(let step=0;step<32;step++){times.push(time);time+=LooperBeats.stepDuration(preset.bpm,preset.swing,step)}for(const [row,hits]of Object.entries(preset.tracks))for(const value of hits){const hit=typeof value==='number'?{step:value}:value;LooperBeats.renderSound(ctx,master,kit[row].sound,times[hit.step],2**((hit.semitones??0)/12),kit[row].gain*(hit.velocity??1))}}const buffer=await ctx.startRendering(),samples=buffer.getChannelData(0);let peak=0,power=0,finite=true,peakIndex=0,sampleIndex=0;for(const sample of samples){if(Math.abs(sample)>peak)peakIndex=sampleIndex;sampleIndex++;finite=finite&&Number.isFinite(sample);peak=Math.max(peak,Math.abs(sample));power+=sample*sample}const rms=Math.sqrt(power/samples.length);results.push({name,peakTime:+(peakIndex/44100).toFixed(4),peak:+peak.toFixed(4),rms:+rms.toFixed(4),finite,pass:finite&&peak<.65&&rms>.005});const p=document.createElement('p'),a=document.createElement('a');a.href=URL.createObjectURL(wav(buffer));a.download=name.replaceAll(' ','-')+'.wav';a.textContent='Pobierz odsłuch: '+name;const audio=document.createElement('audio');audio.controls=true;audio.src=a.href;p.append(a,document.createElement('br'),audio);document.getElementById('previews').append(p)}document.getElementById('results').textContent=JSON.stringify(results,null,2);document.body.dataset.complete='true';})().catch(error=>document.getElementById('results').textContent=String(error));
</script></body></html>
